name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install and build static export
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ secrets.CONTACT_API_URL }}

      - name: Verify export output
        run: |
          test -f out/index.html || (echo "Missing portfolio/out/index.html" && exit 1)
          grep -q "Sumit Chatterjee" out/index.html || (echo "Export does not look like the portfolio" && exit 1)
          test -f out/.nojekyll || touch out/.nojekyll
          echo "Export files:"
          ls -la out | head -15

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/out

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portfolio/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: portfolio static export"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
