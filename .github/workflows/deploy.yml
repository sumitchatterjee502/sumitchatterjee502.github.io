name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install and build static export
        working-directory: portfolio
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ secrets.CONTACT_API_URL }}

      - name: Verify export output
        working-directory: portfolio
        run: |
          test -f out/index.html || (echo "Missing portfolio/out/index.html" && exit 1)
          grep -q "Sumit Chatterjee" out/index.html || (echo "Export does not look like the portfolio" && exit 1)

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portfolio/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: portfolio static export"

      - name: Configure Pages to use gh-pages branch
        continue-on-error: true
        run: |
          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          echo "GitHub Pages source set to gh-pages branch."
