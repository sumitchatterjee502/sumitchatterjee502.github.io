name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        id: pages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Install and build static export
        working-directory: portfolio
        run: |
          rm -f .env .env.local .env.development .env.production
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ secrets.CONTACT_API_URL || 'https://portfolio-contact-api.onrender.com' }}

      - name: Check contact API (Render)
        run: |
          API="${{ secrets.CONTACT_API_URL || 'https://portfolio-contact-api.onrender.com' }}"
          API="${API%/}"
          CODE="$(curl -sS -o /tmp/health.json -w "%{http_code}" "${API}/health" || echo 000)"
          if [ "$CODE" = "200" ]; then
            echo "Contact API OK at ${API}/health"
            cat /tmp/health.json
          else
            echo "::warning::Contact API not ready at ${API}/health (HTTP ${CODE}). The live contact form will fail until you deploy contact-api on Render (render.yaml) and set SMTP secrets."
          fi

      - name: Verify export output
        working-directory: portfolio
        run: |
          test -f out/index.html || (echo "Missing portfolio/out/index.html" && exit 1)
          grep -q "Sumit Chatterjee" out/index.html || (echo "Export does not look like the portfolio" && exit 1)
          test -f out/.nojekyll || touch out/.nojekyll
          test -f out/hero-tech-hardware-bg.png || (echo "Missing hero background asset in export (portfolio/public)" && exit 1)
          echo "Export files:"
          ls -la out | head -20

      - name: Publish site to main branch root
        run: |
          shopt -s dotglob nullglob
          deploy_paths=()
          for item in portfolio/out/*; do
            name="$(basename "$item")"
            rm -rf "$name"
            cp -r "$item" "./$name"
            deploy_paths+=("$name")
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${deploy_paths[@]}"
          if git diff --staged --quiet; then
            echo "No site changes to commit on main."
          else
            git commit -m "deploy: publish site to main root [skip ci]"
            git push origin main
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/out

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portfolio/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: portfolio static export"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
