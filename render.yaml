# Render Blueprint — deploy contact API in one click
# Dashboard: https://dashboard.render.com → New → Blueprint → connect this repo
services:
  - type: web
    name: portfolio-contact-api
    runtime: node
    region: singapore
    plan: free
    rootDir: contact-api
    buildCommand: echo "No build step"
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: CONTACT_TO
        value: sumitchatterjee502@gmail.com
      - key: ALLOWED_ORIGINS
        value: https://sumitchatterjee502.github.io,http://localhost:3000
      - key: SMTP_USER
        value: sumitchatterjee1005@gmail.com
        sync: false # because it's a secret
      - key: SMTP_PASS
        value: fffrxlecbeqovfkr
        sync: false # because it's a secret
