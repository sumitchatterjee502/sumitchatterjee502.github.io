# One-time: Render Dashboard → New → Blueprint → connect this repo
# Or: https://render.com/deploy?repo=https://github.com/sumitchatterjee502/sumitchatterjee502.github.io
services:
  - type: web
    name: portfolio-contact-api
    runtime: node
    region: oregon
    plan: free
    rootDir: contact-api
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: CONTACT_TO
        value: sumitchatterjee502@gmail.com
      - key: ALLOWED_ORIGINS
        value: https://sumitchatterjee502.github.io,http://localhost:3000,http://127.0.0.1:3000
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
